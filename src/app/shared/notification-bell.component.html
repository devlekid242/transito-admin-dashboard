<div class="relative">
	<button
		class="relative flex h-10 w-10 items-center justify-center rounded-lg text-gray-500 transition-colors hover:bg-gray-100"
		aria-label="Notifications"
		(click)="toggle()">
		<i class="fa-solid fa-bell text-lg"></i>
		@if (unreadCount() > 0) {
			<span
				class="absolute right-1.5 top-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-green-500 text-[10px] font-bold text-black">
				{{ unreadCount() > 9 ? "9+" : unreadCount() }}
			</span>
		}
	</button>

	@if (open()) {
		<div
			class="absolute right-0 top-12 z-50 w-96 overflow-hidden rounded-xl border border-gray-200 bg-white shadow-lg">
			<div
				class="flex items-center justify-between border-b border-gray-100 px-4 py-3">
				<p class="text-sm font-semibold text-gray-800">
					Notifications
				</p>
				@if (unreadCount() > 0) {
					<button
						(click)="markAllAsRead()"
						class="text-xs font-medium text-green-600 hover:underline">
						Tout marquer comme lu
					</button>
				}
			</div>

			<div class="max-h-96 overflow-y-auto">
				@if (recent().length === 0) {
					<div class="px-4 py-8 text-center text-sm text-gray-400">
						Aucune notification pour le moment.
					</div>
				} @else {
					@for (n of recent(); track n.id) {
						<a
							routerLink="/admin/notifications"
							(click)="onNotificationClick(n); close()"
							class="flex w-full items-start gap-3 border-b border-gray-50 px-4 py-3 text-left transition-colors hover:bg-gray-50"
							[class.bg-green-50]="!n.isRead">
							<i
								[class]="categoryIcon(n.category)"
								class="mt-0.5 text-base"></i>
							<div class="min-w-0 flex-1">
								<p
									class="truncate text-sm font-medium text-gray-800">
									{{ n.title }}
								</p>
								<p class="line-clamp-2 text-xs text-gray-500">
									{{ n.message }}
								</p>
								<p class="mt-1 text-[11px] text-gray-400">
									{{ n.sentAt }}
								</p>
							</div>
							@if (!n.isRead) {
								<span
									class="mt-1 h-2 w-2 flex-shrink-0 rounded-full bg-green-500"></span>
							}
						</a>
					}
				}
			</div>

			<a
				routerLink="/admin/notifications"
				(click)="close()"
				class="block border-t border-gray-100 px-4 py-2.5 text-center text-xs font-medium text-green-600 hover:bg-gray-50">
				Voir toutes les notifications
			</a>
		</div>
	}
</div>
