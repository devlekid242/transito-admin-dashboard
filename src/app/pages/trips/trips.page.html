<app-page-header
	title="Trajets"
	subtitle="Suivi de tous les trajets de la plateforme avec manifeste passagers." />

<!-- KPIs -->
@if (kpis; as k) {
<div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
	<app-stat-card
		label="Total trajets"
		[value]="str(k?.total ?? 0)"
		icon="fa-route"
		iconBg="bg-green-600"
		accentBar="bg-green-500" />
	<app-stat-card
		label="En cours / Planifiés"
		[value]="str((k?.scheduled ?? 0) + (k?.inProgress ?? 0))"
		icon="fa-clock"
		iconBg="bg-amber-600"
		accentBar="bg-amber-500" />
	<app-stat-card
		label="Passagers transportés"
		[value]="str(k?.totalPassengers ?? 0)"
		icon="fa-users"
		iconBg="bg-emerald-600"
		accentBar="bg-emerald-500" />
	<app-stat-card
		label="Revenu total"
		[value]="fcfa(k?.totalRevenue ?? 0)"
		icon="fa-coins"
		iconBg="bg-green-600"
		accentBar="bg-green-500" />
</div>
}

<!-- Status filter -->
<div
	class="mt-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-end">
	<select
		#statusFilter
		(change)="onStatusChange(statusFilter.value)"
		class="rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none focus:border-green-400 focus:ring-2 focus:ring-green-100">
		<option value="ALL">Tous les statuts</option>
		<option value="SCHEDULED">Planifiés</option>
		<option value="IN_PROGRESS">En cours</option>
		<option value="COMPLETED">Terminés</option>
		<option value="DELAYED">Retardés</option>
		<option value="CANCELLED">Annulés</option>
	</select>
</div>

<!-- DataTable -->
<div class="mt-4">
	<app-data-table
		[columns]="columns"
		[rows]="filtered()"
		[searchKeys]="['ref', 'route', 'agency', 'driver', 'busPlate']"
		searchPlaceholder="Rechercher par réf, trajet, agence, chauffeur, bus..."
		[pageSize]="8">
		<ng-template #rowTemplate let-t>
			<td class="px-5 py-4 font-mono text-xs font-semibold text-gray-700">
				{{ t.ref }}
			</td>
			<td class="px-5 py-4 font-medium text-gray-800">{{ t.route }}</td>
			<td class="px-5 py-4 text-gray-600">{{ t.agency }}</td>
			<td class="px-5 py-4 text-gray-600">
				{{ t.date }}<br /><span class="text-xs text-gray-400">{{ t.departure }} → {{ t.arrival }}</span>
			</td>
			<td class="px-5 py-4 text-gray-600">
				{{ t.busType }}<br /><span class="text-xs text-gray-400">{{ t.busPlate }}</span>
			</td>
			<td class="px-5 py-4 text-gray-600">{{ t.driver }}</td>
			<td class="px-5 py-4">
				<div class="flex items-center gap-2">
					<div
						class="h-2 w-16 overflow-hidden rounded-full bg-gray-100">
						<div
							class="h-full rounded-full bg-green-500"
							[style.width.%]="t.fillRate"></div>
					</div>
					<span class="text-xs font-semibold text-gray-600">{{ t.fillRate }}%</span>
				</div>
				<span class="text-xs text-gray-400">{{ t.bookedSeats }}/{{ t.totalSeats }} places</span>
			</td>
			<td class="px-5 py-4 font-semibold text-gray-900">
				{{ fcfa(t.revenue) }}
			</td>
			<td class="px-5 py-4">
            <app-status-badge [variant]="tripService.getStatusBadgeVariant(t.status)" [label]="tripService.getStatusLabel(t.status)" icon="fa-circle-check" />
			</td>
			<td class="px-5 py-4 text-right">
				<a
					[routerLink]="['/moderation/trips', t.id]"
					class="inline-flex items-center gap-1.5 rounded-lg bg-gray-900 px-3 py-1.5 text-xs font-semibold text-white transition-all hover:bg-gray-800">
					<i class="fa-solid fa-eye"></i> Détails
				</a>
			</td>
		</ng-template>
	</app-data-table>
</div>
