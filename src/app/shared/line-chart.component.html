<div class="flex h-full w-full flex-col">
	@if (legend) {
		<div class="mb-3 flex flex-wrap items-center gap-4">
			@for (s of series(); track s.name) {
				<div class="flex items-center gap-2">
					<span
						class="h-2.5 w-2.5 rounded-full"
						[class]="s.dotClass"></span>
					<span class="text-xs font-medium text-gray-600">{{
						s.name
					}}</span>
				</div>
			}
		</div>
	}
	<div class="relative flex-1">
		<svg
			[attr.viewBox]="'0 0 ' + width + ' ' + height"
			preserveAspectRatio="none"
			class="h-full w-full">
			@for (g of gridLines; track g.y) {
				<line
					[attr.x1]="0"
					[attr.x2]="width"
					[attr.y1]="g.y"
					[attr.y2]="g.y"
					stroke="#f1f5f9"
					stroke-width="1" />
			}
			@for (s of series(); track s.name) {
				<path
					[attr.d]="s.path"
					fill="none"
					[attr.stroke]="s.color"
					stroke-width="2.5"
					stroke-linecap="round"
					stroke-linejoin="round" />
				@if (s.fill) {
					<path
						[attr.d]="s.areaPath"
						[attr.fill]="s.fill"
						opacity="0.12" />
				}
				@for (pt of s.points; track $index) {
					<circle
						[attr.cx]="pt.x"
						[attr.cy]="pt.y"
						r="3.5"
						[attr.fill]="s.color" />
				}
			}
		</svg>
	</div>
	<div class="mt-2 flex justify-between px-1">
		@for (l of labels; track $index) {
			<span class="text-[11px] text-gray-400">{{ l }}</span>
		}
	</div>
</div>
