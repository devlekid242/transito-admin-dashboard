<div class="flex h-full flex-col">
      <div class="flex flex-1 items-end gap-3 px-2 pb-2">
        @for (bar of bars(); track bar.label) {
          <div class="flex flex-1 flex-col items-center gap-2">
            <span class="text-xs font-semibold text-gray-700">{{ formatValue(bar.value) }}</span>
            <div class="flex w-full flex-1 items-end">
              <div
                class="w-full rounded-t-md transition-all duration-700"
                [style.height.%]="bar.pct"
                [style.background]="bar.color"
              ></div>
            </div>
          </div>
        }
      </div>
      <div class="flex gap-3 px-2 pt-1">
        @for (bar of bars(); track bar.label) {
          <div class="flex-1 text-center">
            <span class="text-[11px] text-gray-400">{{ bar.label }}</span>
          </div>
        }
      </div>
    </div>
